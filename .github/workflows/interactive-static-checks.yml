name: Interactive static checks

on:
  pull_request:
    paths:
      - "interactive/**"
      - "docs/INTERACTIVE_ARCHITECTURE.md"
      - "docs/LESSON_AUTHORING_GUIDE.md"
      - "docs/COURSE_INTERACTIVE_MATRIX.md"
      - "docs/THEME3_INTERACTIVE_TRACK.md"
      - "docs/THEME4_INTERACTIVE_TRACK.md"
  push:
    branches:
      - main
    paths:
      - "interactive/**"
      - "docs/INTERACTIVE_ARCHITECTURE.md"
      - "docs/LESSON_AUTHORING_GUIDE.md"
      - "docs/COURSE_INTERACTIVE_MATRIX.md"
      - "docs/THEME3_INTERACTIVE_TRACK.md"
      - "docs/THEME4_INTERACTIVE_TRACK.md"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find interactive/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('interactive/data').rglob('*.json'))
          if not files:
              raise SystemExit('No JSON files found in interactive/data')

          for path in files:
              with path.open(encoding='utf-8') as source:
                  json.load(source)
              print(f'OK: {path}')
          PY

      - name: Validate course catalog links
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs

          root = Path('interactive')
          catalog = json.loads((root / 'data/course.json').read_text(encoding='utf-8'))
          items = list(catalog.get('items', []))

          for group in catalog.get('groups', []):
              items.extend(group.get('items', []))

          items.extend(catalog.get('resources', []))
          missing = []

          for item in items:
              href = item.get('href')
              if not href:
                  continue
              parsed = urlsplit(href)
              target = (root / parsed.path.removeprefix('./')).resolve()
              if not target.is_file():
                  missing.append((item.get('id'), href, 'page'))
                  continue

              query = parse_qs(parsed.query)
              lesson_ids = query.get('lesson', [])
              if lesson_ids:
                  lesson_json = root / 'data' / 'lessons' / f'{lesson_ids[0]}.json'
                  if not lesson_json.is_file():
                      missing.append((item.get('id'), href, 'lesson JSON'))
                      continue

              print(f"OK: {item.get('id')} -> {href}")

          if missing:
              for item_id, href, kind in missing:
                  print(f'MISSING {kind}: {item_id} -> {href}')
              raise SystemExit('Broken links found in interactive/data/course.json')
          PY
