name: Interactive static checks

on:
  pull_request:
    paths:
      - "interactive/**"
      - "docs/INTERACTIVE_ARCHITECTURE.md"
      - "docs/LESSON_AUTHORING_GUIDE.md"
  push:
    branches:
      - main
    paths:
      - "interactive/**"
      - "docs/INTERACTIVE_ARCHITECTURE.md"
      - "docs/LESSON_AUTHORING_GUIDE.md"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find interactive/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('interactive/data').rglob('*.json'))
          if not files:
              raise SystemExit('No JSON files found in interactive/data')

          for path in files:
              with path.open(encoding='utf-8') as source:
                  json.load(source)
              print(f'OK: {path}')
          PY
