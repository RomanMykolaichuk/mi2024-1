ine x1="925" y1="565" x2="986" y2="565" stroke="#5dc4cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="1000" y="500" width="210" height="132" rx="20" fill="#14211e" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="1018" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f6f2" text-anchor="start">ПРОДУКТ</text><text x="1018" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="start">карта · графік · оцінка</text><line x1="1215" y1="565" x2="1276" y2="565" stroke="#5dc4cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="1290" y="500" width="210" height="132" rx="20" fill="#14211e" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="1308" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f6f2" text-anchor="start">РІШЕННЯ</text><text x="1308" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="start">людська інтерпретація</text><rect x="55" y="828" width="1490" height="48" rx="14" fill="#09100f" fill-opacity="0.92" stroke="#182420" stroke-width="1"/><text x="80" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f6f2" text-anchor="start">Ключова ідея: метод обирають під аналітичне питання, дані та обмеження.</text></svg>