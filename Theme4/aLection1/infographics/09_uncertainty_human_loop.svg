" stroke-opacity=".12" stroke-width="2"/><ellipse cx="1140" cy="520" rx="195" ry="70" fill="none" stroke="#d0d4ad" stroke-opacity=".12" stroke-width="2"/><ellipse cx="1380" cy="640" rx="230" ry="90" fill="none" stroke="#d0d4ad" stroke-opacity=".12" stroke-width="2"/><rect width="1600" height="900" filter="url(#grain)" opacity=".30"/><rect x="55" y="45" width="305" height="48" rx="16" fill="#556B2F" fill-opacity="1" stroke="#556B2F" stroke-width="0"/><text x="78" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f6f2" text-anchor="start">ТЕМА 4 · ЛЕКЦІЯ 4.1</text><rect x="1390" y="43" width="150" height="62" rx="18" fill="#09100f" fill-opacity="0.9" stroke="#556B2F" stroke-width="2"/><text x="1465" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f6f2" text-anchor="middle">09/10</text><text x="58" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="700" fill="#f4f6f2" text-anchor="start">Невизначеність і human-in-the-loop</text><text x="60" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#bdc5bc" text-anchor="start">Модель дає evidence; відповідальне рішення потребує людської інтерпретації.</text><rect x="85" y="290" width="1430" height="470" rx="26" fill="#0d1716" fill-opacity="0.93" stroke="#7e8b72" stroke-width="2"/><text x="112" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f6f2" text-anchor="start">Показуйте не лише прогноз, а й межі довіри, припущення та якість джерел.</text><rect x="170" y="445" width="280" height="150" rx="22" fill="#111e1b" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="310" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f6f2" text-anchor="middle">ДЖЕРЕЛА</text><text x="310" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="middle">надійність / актуальність</text><line x1="455" y1="520" x2="535" y2="520" stroke="#5dc4cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="550" y="445" width="280" height="150" rx="22" fill="#111e1b" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="690" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f6f2" text-anchor="middle">МЕТОД</text><text x="690" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="middle">оцінка + uncertainty</text><line x1="835" y1="520" x2="915" y2="520" stroke="#5dc4cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="930" y="445" width="280" height="150" rx="22" fill="#111e1b" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="1070" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f6f2" text-anchor="middle">АНАЛІТИК</text><text x="1070" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="middle">контекст + перевірка</text><line x1="1215" y1="520" x2="1295" y2="520" stroke="#5dc4cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="1310" y="445" width="280" height="150" rx="22" fill="#111e1b" fill-opacity="0.98" stroke="#556B2F" stroke-width="3"/><text x="1450" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f6f2" text-anchor="middle">РІШЕННЯ</text><text x="1450" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#bdc5bc" text-anchor="middle">ризик + наслідки</text><rect x="430" y="650" width="710" height="28" rx="10" fill="#294733" fill-opacity="1" stroke="#294733" stroke-width="0"/><rect x="430" y="650" width="235" height="28" rx="10" fill="#50a064" fill-opacity="1" stroke="#50a064" stroke-width="0"/><rect x="665" y="650" width="235" height="28" rx="0" fill="#bea946" fill-opacity="1" stroke="#bea946" stroke-width="0"/><rect x="900" y="650" width="240" height="28" rx="10" fill="#b45549" fill-opacity="1" stroke="#b45549" stroke-width="0"/><text x="430" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#f4f6f2" text-anchor="start">вища впевненість</text><text x="1140" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#f4f6f2" text-anchor="end">нижча</text><rect x="55" y="828" width="1490" height="48" rx="14" fill="#09100f" fill-opacity="0.92" stroke="#182420" stroke-width="1"/><text x="80" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f6f2" text-anchor="start">Human-in-the-loop — перевірка evidence, контексту й наслідків, а не декоративний «контроль».</text></svg>